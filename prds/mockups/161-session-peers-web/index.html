<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session peers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1F5; --panel:#F8FAFC; --raised:#FFFFFF; --ink:#18212C; --ink-2:#475466; --ink-3:#7A8697;
  --line:#D5DCE5; --line-2:#E4E9EF; --focus:#2F6BFF;
  --claude:#C9643F; --claude-bg:#F9E9E2; --brand-claude:#D97757; --codex:#16836A; --codex-bg:#E2F3EE; --oc:#A06A00; --oc-bg:#F6EED9;
  --human:#C42F66; --human-bg:#FBE7EE;
  --ok:#16836A; --warn:#B76E00; --bad:#C2352B; --ok-bg:#E2F3EE; --warn-bg:#FBF0DC; --bad-bg:#FBE5E3;
  --shadow:0 1px 0 rgba(24,33,44,.04), 0 6px 24px -12px rgba(24,33,44,.18);
  --sans:"Schibsted Grotesk", ui-sans-serif, system-ui, sans-serif; --mono:"JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0F141B; --panel:#151C25; --raised:#1B2430; --ink:#E6EBF1; --ink-2:#A9B4C2; --ink-3:#77839404;
  --ink-3:#778394; --line:#283341; --line-2:#212B37; --focus:#7AA2FF;
  --claude:#E8957A; --claude-bg:#3A2219; --codex:#4CC9A6; --codex-bg:#16302A; --oc:#E2AE3D; --oc-bg:#352A12;
  --human:#FF7BA8; --human-bg:#3A1A27; --ok:#4CC9A6; --warn:#F0B44C; --bad:#FF7A70;
  --ok-bg:#16302A; --warn-bg:#3A2C12; --bad-bg:#3B1C1A; --shadow:0 6px 24px -12px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --paper:#0F141B; --panel:#151C25; --raised:#1B2430; --ink:#E6EBF1; --ink-2:#A9B4C2; --ink-3:#778394;
  --line:#283341; --line-2:#212B37; --focus:#7AA2FF;
  --claude:#E8957A; --claude-bg:#3A2219; --codex:#4CC9A6; --codex-bg:#16302A; --oc:#E2AE3D; --oc-bg:#352A12;
  --human:#FF7BA8; --human-bg:#3A1A27; --ok:#4CC9A6; --warn:#F0B44C; --bad:#FF7A70;
  --ok-bg:#16302A; --warn-bg:#3A2C12; --bad-bg:#3B1C1A; --shadow:0 6px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono);font-size:.86em;letter-spacing:-.01em}

/* shell */
.app{display:grid;grid-template-columns:288px minmax(0,1fr) 320px;grid-template-rows:56px minmax(0,1fr);height:100vh}
header{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:-.01em}
.brand svg{flex:none}
.fleet{display:flex;gap:14px;color:var(--ink-2);font-size:13.5px}
.fleet b{color:var(--ink);font-weight:600}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:6px 10px;width:min(340px,40vw)}
.search input{border:0;background:none;outline:none;width:100%}
.iconbtn{border:1px solid var(--line);background:var(--raised);border-radius:10px;height:34px;min-width:34px;padding:0 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--ink-2)}
.iconbtn:hover{color:var(--ink)}
.mock{font-size:12px;color:var(--warn);background:var(--warn-bg);border-radius:999px;padding:3px 10px;font-weight:600}

/* rail */
nav.rail{border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:12px 10px 24px}
.railhead{display:flex;align-items:baseline;justify-content:space-between;padding:6px 8px 8px;color:var(--ink-2);font-size:13px}
.railhead b{color:var(--ink);font-size:14px}
.lane{border-radius:12px;padding:8px;margin-bottom:4px;cursor:pointer;border:1px solid transparent}
.lane:hover{background:var(--raised)}
.lane[aria-current="true"]{background:var(--raised);border-color:var(--line);box-shadow:var(--shadow)}
.lanetop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lanename{font-weight:600}
.lineage{color:var(--ink-3);font-size:12.5px;margin-top:2px}
.members{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.who{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:2px 9px 2px 6px;border-radius:999px;background:var(--line-2);color:var(--ink)}
.who.claude{background:var(--claude-bg)} .who.codex{background:var(--codex-bg)} .who.oc{background:var(--oc-bg)} .who.human{background:var(--human-bg)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--ink-3)}
.claude .dot,.dot.claude{background:var(--claude)} .codex .dot,.dot.codex{background:var(--codex)} .oc .dot,.dot.oc{background:var(--oc)} .human .dot,.dot.human{background:var(--human)}
.dot.busy{box-shadow:0 0 0 0 currentColor;animation:pulse 1.6s infinite}
.claude .dot.busy{color:var(--claude)} .codex .dot.busy{color:var(--codex)} .oc .dot.busy{color:var(--oc)}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,currentColor 55%,transparent)}70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
.badge{font-size:12px;font-weight:600;border-radius:999px;padding:1px 8px;background:var(--line-2);color:var(--ink-2)}
.badge.alert{background:var(--warn-bg);color:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:10px;padding:14px 8px 0;color:var(--ink-3);font-size:12.5px;border-top:1px solid var(--line-2);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* main */
main{display:flex;flex-direction:column;min-width:0;min-height:0}
.convhead{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--paper)}
.convhead h1{font-size:18px;margin:0;letter-spacing:-.01em;font-weight:700}
.tabs{display:flex;gap:4px;margin-left:auto;background:var(--line-2);padding:3px;border-radius:10px}
.tabs button{border:0;background:none;padding:5px 12px;border-radius:8px;cursor:pointer;color:var(--ink-2);font-size:13.5px}
.tabs button[aria-selected="true"]{background:var(--raised);color:var(--ink);box-shadow:var(--shadow)}
.coverage{margin:12px 20px 0;padding:10px 12px;border-radius:10px;background:var(--warn-bg);color:var(--ink);font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
.coverage svg{flex:none;margin-top:2px;color:var(--warn)}
.stream{flex:1;overflow:auto;padding:16px 20px 24px;display:flex;flex-direction:column;gap:14px}
.day{align-self:center;font-size:12.5px;color:var(--ink-3);padding:2px 10px;border-radius:999px;background:var(--line-2)}
.msg{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;max-width:760px}
.avatar{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--ink);border:1px solid var(--line);background:var(--raised)}
.avatar svg{width:20px;height:20px}
.avatar.claude{background:var(--claude-bg)} .avatar.codex{background:var(--codex-bg)} .avatar.oc{background:var(--oc-bg)} .avatar.human{background:var(--human-bg);color:var(--human)}
.hicon{display:inline-grid;place-items:center;width:14px;height:14px;flex:none} .hicon svg{width:13px;height:13px}
.claude-mark{color:var(--brand-claude)}
.chan{color:var(--ink-3);font-weight:500;margin-right:1px}
.allwarn{margin-top:8px;font-size:13px;padding:8px 10px;border-radius:10px;background:var(--human-bg);color:var(--ink)}
.allwarn b{color:var(--human)}
.meta{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;font-size:13px;color:var(--ink-3)}
.meta .name{font-weight:600;color:var(--ink);font-size:14.5px}
.meta .rt{font-size:12px}
.body{margin-top:2px;color:var(--ink);overflow-wrap:anywhere}
.body p{margin:0 0 6px}
.body code{font-family:var(--mono);font-size:.86em;background:var(--line-2);padding:1px 5px;border-radius:5px}
.replyto{font-size:12.5px;color:var(--ink-3);border-left:2px solid var(--line);padding-left:8px;margin:2px 0 6px}

/* the signature: verdict + delivery ladder */
.verdict{display:grid;grid-template-columns:auto minmax(0,1fr);border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--raised);margin:4px 0 6px}
.verdict .v{display:grid;place-items:center;padding:10px 14px;font-weight:700;font-size:14px;letter-spacing:.02em;min-width:104px}
.verdict.approve .v{background:var(--ok-bg);color:var(--ok)}
.verdict.revise .v{background:var(--warn-bg);color:var(--warn)}
.verdict.block .v{background:var(--bad-bg);color:var(--bad)}
.verdict .vd{padding:9px 12px;font-size:14px}
.verdict .pin{color:var(--ink-2);font-size:13px;margin-top:2px}
.ladder{display:flex;align-items:center;gap:0;margin-top:6px;font-size:12px;color:var(--ink-3);flex-wrap:wrap;row-gap:4px}
.step{display:inline-flex;align-items:center;gap:5px;padding:0 2px}
.step i{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--ink-3);display:inline-block}
.step.done{color:var(--ink-2)} .step.done i{background:var(--ok);border-color:var(--ok)}
.step.miss{color:var(--bad)} .step.miss i{border-color:var(--bad)}
.step.now i{border-color:var(--focus);background:var(--focus);animation:pulse 1.4s infinite;color:var(--focus)}
.bar{width:18px;height:1.5px;background:var(--line);margin:0 2px}
.bar.done{background:var(--ok)}
.ackline{font-size:12.5px;color:var(--ok);margin-top:4px}
.notice{max-width:760px;margin-left:46px;font-size:13px;color:var(--ink-3);border:1px dashed var(--line);border-radius:10px;padding:8px 10px}
.notice b{color:var(--ink-2)}

/* composer */
.composer{border-top:1px solid var(--line);background:var(--panel);padding:12px 20px 14px}
.toline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px;color:var(--ink-2);margin-bottom:8px}
.box{display:flex;gap:10px;align-items:flex-end;background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 12px}
.box:focus-within{border-color:var(--focus)}
.box textarea{flex:1;border:0;outline:none;background:none;resize:none;min-height:44px;max-height:180px;padding:4px 0}
.send{border:0;background:var(--ink);color:var(--paper);border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer}
.send:disabled{opacity:.4;cursor:default}
.opts{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--ink-3)}
.opts label{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.authority{color:var(--human)}

/* inspector */
aside{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:16px}
aside h2{font-size:15px;margin:0 0 10px;font-weight:700}
.card{background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.srow{display:flex;align-items:center;gap:10px}
.srow .nm{font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;margin-top:10px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0;color:var(--ink);overflow-wrap:anywhere}
.meter{height:6px;border-radius:99px;background:var(--line-2);overflow:hidden;margin-top:4px}
.meter span{display:block;height:100%;background:var(--codex)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.acts button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer}
.acts button:hover{border-color:var(--ink-3)}
.gates li{margin:0 0 6px;font-size:13.5px}
.gates{padding-left:18px;margin:4px 0 0}
.tally{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.tally span{font-size:12px;padding:1px 7px;border-radius:999px;background:var(--ok-bg);color:var(--ok)}
.tally span.no{background:var(--line-2);color:var(--ink-3)}

/* mobile */
.mobtabs{display:none}
@media (max-width:1080px){ .app{grid-template-columns:260px minmax(0,1fr)} aside{display:none} }
@media (max-width:720px){
  .app{grid-template-columns:1fr;grid-template-rows:52px minmax(0,1fr) 56px}
  nav.rail,main,aside{grid-column:1;grid-row:2;display:none}
  .app[data-pane="rail"] nav.rail,.app[data-pane="main"] main,.app[data-pane="info"] aside{display:flex;flex-direction:column}
  .app[data-pane="rail"] nav.rail{display:block}
  .app[data-pane="info"] aside{display:block}
  .fleet,.search{display:none}
  header{padding:0 16px}
  .mobtabs{display:flex;grid-row:3;border-top:1px solid var(--line);background:var(--panel)}
  .mobtabs button{flex:1;border:0;background:none;color:var(--ink-3);font-weight:600;font-size:13.5px}
  .mobtabs button[aria-selected="true"]{color:var(--ink)}
  .stream,.convhead,.composer{padding-left:16px;padding-right:16px}
  .coverage{margin-left:16px;margin-right:16px}
  .notice{margin-left:0}
  .tabs{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app" data-pane="main">
  <header>
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="6" cy="11" r="4" fill="var(--claude)"/><circle cx="16" cy="6" r="3.2" fill="var(--codex)"/><circle cx="16" cy="16" r="3.2" fill="var(--oc)"/><path d="M9.5 9.6 13.3 7.2M9.5 12.4l3.8 2.4" stroke="var(--ink-3)" stroke-width="1.4" stroke-linecap="round"/></svg>
      Session peers
    </div>
    <div class="fleet" id="fleet"></div>
    <label class="search"><svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" stroke="currentColor" fill="none" stroke-width="1.6"/><path d="m11 11 3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg><input id="q" placeholder="Search sessions, messages, SHAs" aria-label="Search"></label>
    <span class="mock">Mock data (design reference for PRD #161 and #162)</span>
    <button class="iconbtn" id="theme" aria-label="Toggle colour theme" title="Toggle theme"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5a6.5 6.5 0 1 0 0 13z" fill="currentColor"/><circle cx="8" cy="8" r="6.5" stroke="currentColor" fill="none" stroke-width="1.4"/></svg></button>
  </header>

  <nav class="rail" aria-label="Channels">
    <div class="railhead"><b>Channels</b><span id="lanecount"></span></div>
    <div id="lanes"></div>
    <div class="legend" id="legend"></div>
  </nav>

  <main>
    <div class="convhead">
      <h1 id="title"></h1>
      <span class="badge" id="sub"></span>
      <div class="tabs" role="tablist">
        <button role="tab" aria-selected="true" data-view="conv">Conversation</button>
        <button role="tab" aria-selected="false" data-view="fleet">All channels</button>
      </div>
    </div>
    <div id="coverage"></div>
    <div class="stream" id="stream" aria-live="polite"></div>
    <form class="composer" id="composer">
      <div class="toline">To
        <span id="targets"></span>
      </div>
      <div class="box">
        <textarea id="text" rows="1" placeholder="Ask, steer or brief a session. @all reaches every session" aria-label="Message"></textarea>
        <button class="send" id="sendbtn" disabled>Send</button>
      </div>
      <div id="allwarn"></div>
      <div class="opts">
        <label><input type="checkbox" id="record" checked> Keep in journal</label>
        <label><input type="checkbox" id="needack"> Ask for ACK</label>
        <span class="authority">Arrives as peer input, not your approval. Approve in the session's own terminal.</span>
      </div>
    </form>
  </main>

  <aside aria-label="Session details" id="info"></aside>

  <div class="mobtabs" role="tablist">
    <button data-pane="rail" aria-selected="false">Channels</button>
    <button data-pane="main" aria-selected="true">Chat</button>
    <button data-pane="info" aria-selected="false">Details</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
