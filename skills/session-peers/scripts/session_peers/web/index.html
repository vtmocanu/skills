<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>Session peers</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="app pane-main" id="app">
  <header>
    <div class="brand">
      <svg class="brandmark" width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle class="b-claude" cx="6" cy="11" r="4"/><circle class="b-codex" cx="16" cy="6" r="3.2"/><circle class="b-oc" cx="16" cy="16" r="3.2"/><path class="b-link" d="M9.5 9.6 13.3 7.2M9.5 12.4l3.8 2.4" stroke-width="1.4" stroke-linecap="round"/></svg>
      <span>Session peers</span>
      <span class="ro" id="modebadge" title="This page never sends, ACKs or changes anything">read-only</span>
    </div>
    <div class="fleet" id="fleet"></div>
    <span class="live" id="live" role="status"></span>
    <div class="search" role="search">
      <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><path d="M7 2a5 5 0 1 0 0 10A5 5 0 1 0 7 2" stroke="currentColor" fill="none" stroke-width="1.6"/><path d="m11 11 3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <input id="q" type="search" maxlength="256" autocomplete="off" spellcheck="false" placeholder="Search messages" aria-label="Search messages">
      <select id="scope" aria-label="Search scope">
        <option value="all">All channels</option>
        <option value="channel">This channel</option>
      </select>
    </div>
    <span class="themebox" id="themebox"></span>
  </header>

  <nav class="rail" aria-label="Channels">
    <div class="railhead"><b>Channels</b><span id="lanecount"></span></div>
    <div id="lanes"></div>
    <div id="railnotes"></div>
    <div class="legend" id="legend"></div>
  </nav>

  <main id="main">
    <div class="convhead">
      <h1 id="title" tabindex="-1">Session peers</h1>
      <span class="badge" id="sub"></span>
      <div class="tabs" role="tablist" aria-label="View" id="viewtabs"></div>
    </div>
    <div id="coverage"></div>
    <div id="notes" class="notes"></div>
    <div class="stream" id="stream"></div>
    <div class="composer" id="composer"></div>
  </main>

  <aside aria-label="Session details" id="info"></aside>

  <div class="mobtabs" role="tablist" aria-label="Pane" id="mobtabs"></div>
</div>
<script src="/app.js"></script>
</body>
</html>
