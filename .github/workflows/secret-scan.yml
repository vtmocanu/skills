name: secret-scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install checksum-verified gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" version

      - name: Scan changed commits for secrets
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base=$(git merge-base "$PR_BASE" "$PR_HEAD")
            range="$base..$PR_HEAD"
          elif [[ "$EVENT_NAME" == push ]]; then
            if [[ "$PUSH_BEFORE" == 0000000000000000000000000000000000000000 ]]; then
              # A new branch has no previous tip; scan all history reachable from its head.
              range="$PUSH_HEAD"
            else
              # A force-pushed old tip may no longer be reachable from any fetched ref.
              if ! git cat-file -e "$PUSH_BEFORE^{commit}"; then
                git fetch --no-tags origin "$PUSH_BEFORE"
              fi
              range="$PUSH_BEFORE..$PUSH_HEAD"
            fi
          else
            echo "Unsupported event: $EVENT_NAME" >&2
            exit 1
          fi
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" git --redact \
            --log-opts="--full-history --diff-merges=first-parent $range" .
