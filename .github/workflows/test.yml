name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The historical-corpus test walks past revisions of roles.yaml. With
          # the default shallow checkout it still passes — over however few
          # revisions the clone happens to contain — so it would report the same
          # test name as the local run while covering less.
          fetch-depth: 0

      - name: Validate skill frontmatter
        run: python3 scripts/validate_skills.py .

      - name: Check agent-kit bundle coverage
        run: python3 scripts/check_bundle_coverage.py skills/agent-kit

      # validate_skills.py reads frontmatter and never opens a .py file, so it
      # was green on a tree containing every defect this suite now covers.
      - name: Install sync.py's only dependency
        run: python3 -m pip install --disable-pip-version-check pyyaml

      - name: Test skills/agent-kit/agent-team/scripts/sync.py
        run: python3 skills/agent-kit/agent-team/scripts/test_sync.py

      - name: Test skills/skill-maker/scripts/refresh_skills.py
        run: python3 skills/skill-maker/scripts/test_refresh_skills.py

  peers-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      # Stdlib only. Temp roots, fake binaries, and fixture rollouts keep the
      # suite independent of installed agents and exercise each real runtime.
      - name: Test skills/session-peers/scripts/peers.py
        run: python3 skills/session-peers/scripts/test_peers.py
