name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Validate skill frontmatter
        run: python3 scripts/validate_skills.py .

      # validate_skills.py reads frontmatter and never opens a .py file, so it
      # was green on a tree containing every defect this suite now covers.
      - name: Install sync.py's only dependency
        run: python3 -m pip install --disable-pip-version-check pyyaml

      - name: Test agent-team/scripts/sync.py
        run: python3 agent-team/scripts/test_sync.py
